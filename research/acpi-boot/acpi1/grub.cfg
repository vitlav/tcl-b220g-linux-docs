set timeout=5
set default=tcl-audio2-va
if search --no-floppy --file --set=root /tcl-acpi1/TCL-ACPI1; then
    if load_env -f ($root)/tcl-acpi1/grubenv next_entry; then
        if [ "$next_entry" = "tcl-acpi1" ]; then
            set next_entry=
            if save_env -f ($root)/tcl-acpi1/grubenv next_entry; then
                set default=tcl-acpi1
            fi
        fi
    fi
fi
terminal_input console
terminal_output console
set pager=1
menuentry 'TCL diagnostic USB - show UEFI video information' {
    echo 'GRUB ARM64 is running. Linux has NOT been started.'
    videoinfo
    echo 'Press Escape to return to menu.'
    sleep --interruptible 3600
}
menuentry 'Show UEFI memory map (Space: next page)' {
    set pager=1
    lsefimmap
    echo 'Press Escape to return to menu.'
    sleep --interruptible 3600
}
menuentry 'Reboot - remove USB to return to Windows' {
    reboot
}

menuentry 'EXPERIMENTAL: Linux RAM test - one CPU, no UFS' {
